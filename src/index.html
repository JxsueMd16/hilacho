<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Hilacho</title>
<style>html,body{margin:0;height:100%;background:#0a1428;overflow:hidden}canvas{position:absolute;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}</style></head><body><canvas id="c"></canvas><script>
const W=960,H=540,T=30,DT=1/60,c=document.getElementById('c'),x=c.getContext('2d'),F='system-ui,-apple-system,"Segoe UI",sans-serif';
// física (px/s)
const G=1900,VMAX=260,ACC=2400,ACC_AIRE=1500,FRIC=2600,SALTO=640,COYOTE=.1,BUFFER=.1;
const LANA=['#b83a5e','#e8577d','#f7a1b5','#ff9a3c','#ffd27a'];

function ajustar(){const d=devicePixelRatio||1,w=innerWidth,h=innerHeight,e=Math.min(w/W,h/H);
c.width=W*e*d;c.height=H*e*d;c.style.width=W*e+'px';c.style.height=H*e+'px';
c.style.left=(w-W*e)/2+'px';c.style.top=(h-H*e)/2+'px';x.setTransform(e*d,0,0,e*d,0,0)}
addEventListener('resize',ajustar);ajustar();

// '#' suelo, '~' agua, 'P' spawn, 'C' meta
const MENU='18.P/32#*2';
const niveles=[
{n:'EL CHARCO',tips:[[70,300,'MANTÉN SHIFT PARA LANZAR HILO'],[560,330,'EL HILO ENREDA A LOS RATONES']],m:'..P22.r4.C/12#9.14#/12#9~14#*3'},
{n:'EL MURO',tips:[[70,300,'↑ MIENTRAS LANZAS ESTIRA EL ARCO'],[470,170,'LAS POLILLAS SE COMEN TU HILO']],m:'21.m/27.C/14.18#*3/..P11.18#/32#*4'},
{n:'LA BAJADA',tips:[[40,200,'MANTÉN ↓ MIENTRAS LANZAS PARA QUE BAJE']],m:'24.8#*9/..P21.8#/10#14.8#*3/10#8.r..C..8#/10#8.5#.8#/10#8~5#~8#*3'},
{n:'TODO JUNTO',tips:[[70,300,'SALTA DESDE EL HILO · →→ PARA DASH']],m:'42.m//50.C/32.24#*3/..P23.r5.24#/12#9.35#/12#9~35#*3'},
{n:'LAS ISLAS',tips:[[60,280,'DOSIFICA ↓ PARA CAER EN ISLAS CHICAS']],m:'29.m/..P35.r7.C/8#6.3#6.3#7.18#/8#6~3#6~3#7~18#*3'},
{n:'LA RATONERA',tips:[[70,300,'CUATRO RATONES, TRES CHARCOS']],m:'..P14.r5.r10.r4.r17.C/10#6.10#6.10#6.12#/10#6~10#6~10#6~12#*3'},
{n:'LAS POLILLAS',tips:[[70,250,'UN POCO DE ↑ PARA LLEGAR MÁS LEJOS']],m:'13.m6.m6.m/..P35.C/10#17.14#/10#17~14#*3'},
{n:'EL POZO',tips:[[230,60,'TRES BAJADAS, NINGUNA RED']],m:'..P/6#*4/6#8.5#*3/6#8.5#10.r/6#8.5#8.5#*3/6#8.5#8.5#12.r2.C/6#8.5#8.5#8.11#/6#8~5#8~5#8~11#*2'},
{n:'LOS ESCALONES',tips:[[40,330,'TRES MUROS Y DOS POLILLAS']],m:'41.C/34.11#/29.m4.11#/34.11#*2/24.21#/19.m4.21#/24.21#*2/14.31#*3/..P11.31#/10#4.31#/10#4~31#*3'},
{n:'LA CASA DE LA ABUELA',tips:[[40,280,'¡LLEVA EL HILO A CASA!']],m:'30.m//36.r7.C/22.25#*3/..P19.25#/8#6.3#5.25#/8#6~3#5~25#*3'}];
// filas con RLE ('12#' = 12 suelos), '/' separa filas, '*3' repite la fila, arriba se rellena con aire
const dec=s=>{const r=[];s.split('/').forEach(f=>{const[a,n]=f.split('*'),row=a.replace(/(\d+)(\D)/g,(_,k,ch)=>ch.repeat(k));for(let i=0;i<(n||1);i++)r.push(row)});while(r.length<18)r.unshift('');return r};
niveles.forEach(l=>l.m=dec(l.m));

let nivel,j,cam=0,estado='menu',t=0,muertes=0,lines=[],trazo=null,bloq=0,tinta=100,reloj=0,shake=0,parts=[],nNivel=0,
sel=0,volver='menu',trans=0,tIntro=0,ajus={mus:1,son:1,sac:1},fake={};
let ultToque={d:0,t:0};const k={},teclaSalto=['ArrowUp','KeyW','Space'];
const enMenu=()=>nivel.menu&&estado!='jugando';
const tecla=(...a)=>a.some(n=>(enMenu()?fake:k)[n]);

// ---------- audio ----------
let ac,master,musG,ruido,p8=0,proxT=0;
function iniAudio(){if(ac)return;ac=new AudioContext();master=ac.createGain();master.gain.value=.5;master.connect(ac.destination);
musG=ac.createGain();musG.connect(master);ruido=ac.createBuffer(1,ac.sampleRate/2,ac.sampleRate);
const d=ruido.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;setInterval(musica,25)}
// marimba: fundamental + parciales inarmónicos (≈3.9x y 9.1x) que decaen más rápido
function marimba(f,t0,vol,dest){const d=Math.min(1.3,.12+110/f);[[1,1,1],[3.93,.3,.3],[9.1,.06,.12]].forEach(([m,g,dd])=>{if(f*m>12e3)return;
const o=ac.createOscillator(),gn=ac.createGain();o.type='sine';o.frequency.value=f*m;gn.gain.setValueAtTime(0,t0);gn.gain.linearRampToValueAtTime(vol*g,t0+.004);
gn.gain.exponentialRampToValueAtTime(.0005,t0+d*dd);o.connect(gn);gn.connect(dest);o.start(t0);o.stop(t0+d*dd+.02)})}
const mar=(f,vol=.12)=>ac&&ajus.son&&marimba(f,ac.currentTime,vol,master);
function chof(vol,d){if(!ac||!ajus.son)return;const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain(),n=ac.currentTime;
s.buffer=ruido;fl.type='lowpass';fl.frequency.value=900;g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.001,n+d);
s.connect(fl);fl.connect(g);g.connect(master);s.start()}
// son en 6/8 (Sol mayor): bajo en 1 y 4, acordes en el resto, melodía con terceras y trémolo en notas largas
const mtof=n=>440*2**((n-69)/12),SC=[55,57,59,60,62,64,66,67,69,71,72,74,76,78,79,81,83],
PROG=[[43,[59,62]],[48,[60,64]],[50,[57,62]],[43,[59,62]],[48,[60,64]],[43,[59,62]],[50,[57,66]],[43,[59,62]]],
MEL=[71,74,79,78,76,74, 76,0,72,76,79,76, 74,78,81,78,74,72, 71,0,0,67,71,74, 72,76,79,81,79,76, 74,71,67,71,74,79, 78,76,74,72,71,69, 67,0,0,0,0,0],
PENTA=[67,69,71,74,76,79,81,83,86,88].map(n=>mtof(n+12));
function musica(){if(!ajus.mus)return proxT=0;const e=60/190;if(proxT<ac.currentTime)proxT=ac.currentTime+.05;
while(proxT<ac.currentTime+.15){const s=p8%6,[b,ch]=PROG[(p8/6|0)%8],m=MEL[p8%48];
if(s%3==0)marimba(mtof(b),proxT,.2,musG);else ch.forEach(n=>marimba(mtof(n),proxT,.045,musG));
if(m){const h=SC[SC.indexOf(m)-2],roll=!MEL[(p8+1)%48];
for(let q=0;q<(roll?6:1);q++){const tt=proxT+q*e/3,v=.11*(1-q/7);marimba(mtof(m),tt,v,musG);if(h)marimba(mtof(h),tt,v*.6,musG)}}
proxT+=e;p8++}}
const fanfarria=()=>ac&&ajus.son&&[67,71,74,79,83].forEach((n,i)=>marimba(mtof(n+12),ac.currentTime+i*.08,.12,master));

// ---------- entrada y menús ----------
const MENUS={menu:['JUGAR','CÓMO JUGAR','AJUSTES'],pausa:['CONTINUAR','REINTENTAR','CÓMO JUGAR','AJUSTES','ABANDONAR']};
const sn=v=>v?'SÍ':'NO',opciones=()=>estado=='ajustes'?['MÚSICA: '+sn(ajus.mus),'SONIDOS: '+sn(ajus.son),'SACUDIDA: '+sn(ajus.sac),'VOLVER']:MENUS[estado];
onkeydown=e=>{const cd=e.code,ok=cd=='Enter'||cd=='Space',esc=cd=='Escape'||cd=='KeyP';
if(/Arrow|Space/.test(cd))e.preventDefault();iniAudio();k[cd]=1;if(e.repeat)return;
if(estado=='jugando'){if(teclaSalto.includes(cd)&&!(trazo&&cd!='Space'))j.buffer=BUFFER;
// doble toque ←← / →→ = dash
const dd=/ArrowRight|KeyD/.test(cd)?1:/ArrowLeft|KeyA/.test(cd)?-1:0;
if(dd){if(ultToque.d==dd&&t-ultToque.t<.25){j.dashPide=dd;ultToque.d=0}else ultToque={d:dd,t}}if(cd=='KeyR')morir(0);if(esc){estado='pausa';sel=0;mar(587,.1)}return}
const op=opciones();
if(op){if(/ArrowUp|KeyW/.test(cd)){sel=(sel+op.length-1)%op.length;mar(880,.07)}
if(/ArrowDown|KeyS/.test(cd)){sel=(sel+1)%op.length;mar(880,.07)}
if(ok){mar(1175,.1);elegir(op[sel])}if(esc)elegir(estado=='pausa'?'CONTINUAR':estado=='ajustes'?'VOLVER':'');return}
if(estado=='como'&&(ok||esc)){estado=volver;sel=0}
else if(estado=='intro'&&ok){reloj=muertes=0;cargar(0);estado='jugando'}
else if(estado=='fin'&&ok)irMenu()};
onkeyup=e=>k[e.code]=0;

// ---------- táctil: botones virtuales que simulan teclas ----------
let tactil='ontouchstart' in window;const dedos={};
const BOT=[{id:'izq',x:56,y:488,r:34,c:'ArrowLeft'},{id:'der',x:140,y:488,r:34,c:'ArrowRight'},
{id:'hilo',x:W-142,y:492,r:34,c:'ShiftLeft'},{id:'sal',x:W-56,y:478,r:38,c:'Space'},{id:'pau',x:W/2,y:30,r:17,c:'Escape'}];
const vertical=()=>tactil&&innerHeight>innerWidth;
const pulsa=cd=>onkeydown({code:cd,repeat:0,preventDefault(){}}),suelta=cd=>onkeyup({code:cd});
function logico(tq){const b=c.getBoundingClientRect();return[(tq.clientX-b.left)/b.width*W,(tq.clientY-b.top)/b.height*H]}
const botEn=(px,py)=>{let m,dm=1e9;BOT.forEach(b=>{const d=Math.hypot(px-b.x,py-b.y)/b.r;if(d<1.7&&d<dm){dm=d;m=b}});return m};
function curva(d,py){const dy=py-d.y0;k.KeyW=dy<-22?1:0;k.KeyS=dy>22?1:0}
function toque(e){e.preventDefault();tactil=1;iniAudio();
for(const tq of e.changedTouches){const[px,py]=logico(tq),id=tq.identifier;
if(e.type=='touchstart'){
if(estado!='jugando'){tocarMenu(py);continue}
const b=botEn(px,py);if(b){dedos[id]={b,y0:py};pulsa(b.c);if(b.c=='Escape')suelta(b.c)}}
else if(e.type=='touchmove'){const d=dedos[id];if(!d)continue;
if(d.b.c=='ShiftLeft')curva(d,py);
// deslizar entre ◀ y ▶
else if(d.b.id=='izq'||d.b.id=='der'){const b=botEn(px,py);if(b&&b!=d.b&&(b.id=='izq'||b.id=='der')){suelta(d.b.c);d.b=b;pulsa(b.c)}}}
else{const d=dedos[id];if(d){suelta(d.b.c);if(d.b.c=='ShiftLeft')k.KeyW=k.KeyS=0;delete dedos[id]}}}}
['touchstart','touchmove','touchend','touchcancel'].forEach(n=>c.addEventListener(n,toque,{passive:false}));
// en menús: tocar una opción la elige; tocar fuera avanza
function tocarMenu(py){const op=opciones(),L={menu:[300,52],ajustes:[240,56],pausa:[215,58]}[estado];
if(op&&L){const i=Math.round((py-L[0]+10)/L[1]);if(!(i>=0&&i<op.length))return;sel=i}pulsa('Enter');suelta('Enter')}
function pantallaCompleta(){if(!tactil)return;try{const d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen).call(d).then(()=>screen.orientation.lock('landscape')).catch(()=>{})}catch(e){}}
function botones(){if(!tactil||estado!='jugando')return;BOT.forEach(b=>{const on=Object.values(dedos).some(d=>d.b==b),r=b.r;
if(on){x.globalAlpha=.3;x.fillStyle='#fff';x.beginPath();x.arc(b.x,b.y,r,0,7);x.fill()}
x.globalAlpha=on?.9:.32;x.strokeStyle='#fff';x.lineWidth=1.5;x.beginPath();x.arc(b.x,b.y,r,0,7);x.stroke();x.fillStyle='#fff';x.beginPath();
if(b.id=='izq'||b.id=='der'){const q=b.id=='izq'?-1:1;x.moveTo(b.x+q*10,b.y);x.lineTo(b.x-q*7,b.y-11);x.lineTo(b.x-q*7,b.y+11);x.fill()}
else if(b.id=='sal'){x.moveTo(b.x,b.y-13);x.lineTo(b.x+12,b.y+1);x.lineTo(b.x+4,b.y+1);x.lineTo(b.x+4,b.y+11);x.lineTo(b.x-4,b.y+11);x.lineTo(b.x-4,b.y+1);x.lineTo(b.x-12,b.y+1);x.fill()}
else if(b.id=='pau'){x.fillRect(b.x-6,b.y-7,4,14);x.fillRect(b.x+2,b.y-7,4,14)}
else{x.save();x.translate(b.x,b.y);ovillo(12,t*(on?8:.5));x.restore();if(on){txt('↑',b.x,b.y-r-8,16);txt('↓',b.x,b.y+r+16,16)}}});x.globalAlpha=1}
function elegir(o){const s=o.split(':')[0];
if(s=='JUGAR'){estado='intro';tIntro=t;pantallaCompleta()}
else if(s=='CÓMO JUGAR'){volver=estado;estado='como'}
else if(s=='AJUSTES'){volver=estado;estado='ajustes';sel=0}
else if(s=='CONTINUAR')estado='jugando';
else if(s=='REINTENTAR'){estado='jugando';morir(0)}
else if(s=='ABANDONAR')irMenu();
else if(s=='MÚSICA')ajus.mus^=1;else if(s=='SONIDOS')ajus.son^=1;else if(s=='SACUDIDA')ajus.sac^=1;
else if(s=='VOLVER'){estado=volver;sel=volver=='pausa'?3:2}}

// ---------- nivel ----------
function usar(m,menu){nivel={m,menu,w:Math.max(...m.map(f=>f.length)),h:m.length};
m.forEach((f,y)=>[...f].forEach((ch,x)=>{if(ch=='P')nivel.spawn={x:x*T+3,y:y*T+T-20}}));cam=0;reaparecer()}
function cargar(n){nNivel=n;usar(niveles[n].m)}
function irMenu(){usar(dec(MENU),1);estado='menu';sel=0}
function reaparecer(){lines=[];trazo=null;tinta=100;j={x:nivel.spawn.x,y:nivel.spawn.y,w:24,h:20,vx:0,vy:0,dir:1,suelo:0,coyote:0,buffer:0,paso:0,enHilo:0,incl:0,dash:1,dashT:0,dashPide:0};crearEnem()}
const tile=(tx,ty)=>(nivel.m[ty]||'')[tx]||'.';
const solido=(tx,ty)=>tx<0||tx>=nivel.w||tile(tx,ty)=='#';
function chispas(px,py,n,co,f){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=Math.random()*f;parts.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v-f*.3,v:.4+Math.random()*.4,co})}}
function morir(splash){muertes++;shake=splash?12:5;chispas(j.x+j.w/2,j.y+j.h,splash?24:10,splash?'#bff0ff':'#fff',splash?260:140);
if(splash){chof(.25,.45);mar(147,.16)}else mar(220,.14);reaparecer()}

function chocar(ejeY){const x0=Math.floor(j.x/T),x1=Math.floor((j.x+j.w-.01)/T),y0=Math.floor(j.y/T),y1=Math.floor((j.y+j.h-.01)/T);
for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(solido(tx,ty)){
if(ejeY){if(j.vy>0){j.y=ty*T-j.h;j.suelo=j.sueloTile=1}else j.y=ty*T+T;j.vy=0}
else{if(j.vx>0)j.x=tx*T-j.w;else j.x=tx*T+T;j.vx=0}return}}
// la meta también cuenta si pasas justo por encima (por ejemplo, caminando sobre un hilo)
function enMeta(){if(toca('C',2))return 1;j.y+=36;const r=toca('C',2);j.y-=36;return r}
function toca(ch,m){for(let ty=Math.floor((j.y+m)/T);ty<=Math.floor((j.y+j.h-m)/T);ty++)
for(let tx=Math.floor((j.x+m)/T);tx<=Math.floor((j.x+j.w-m)/T);tx++)if(tile(tx,ty)==ch)return 1}

// ---------- enemigos: 'r' ratón, 'm' polilla ----------
let enem=[];
function crearEnem(){enem=[];if(nivel.menu)return;nivel.m.forEach((f,y)=>[...f].forEach((ch,i)=>{
if(ch=='r')enem.push({t:'r',x:i*T+4,y:y*T+T-12,w:22,h:12,vx:-40});
if(ch=='m')enem.push({t:'m',hx:i*T+15,hy:y*T+15,x:-99,y:-99,w:26,h:20,ph:i,cd:0})}))}
function enemPaso(dt){for(const e of enem){
if(e.t=='r'){const nx=e.x+e.vx*dt,fx=Math.floor((e.vx>0?nx+e.w:nx)/T);
if(!solido(fx,Math.floor((e.y+e.h+2)/T))||solido(fx,Math.floor((e.y+6)/T)))e.vx*=-1;else e.x=nx}
else{e.x=e.hx+Math.sin(t*.9+e.ph)*60-e.w/2;e.y=e.hy+Math.sin(t*2.3+e.ph)*12-e.h/2;e.cd-=dt;
// la polilla se come el hilo y lo parte en dos
if(e.cd<=0)for(const l of [...lines])if(l!=trazo&&!l.f){const i=l.p.findIndex(([u,v])=>Math.hypot(u-e.x-e.w/2,v-e.y-e.h/2)<14);
if(i>=0){const b=l.p.slice(i+1);l.p=l.p.slice(0,i);if(b.length>1)lines.push({...l,p:b,off:0,s:l.s+7});if(l.p.length<2)lines.splice(lines.indexOf(l),1);
chispas(e.x+9,e.y+7,8,'#f7a1b5',80);mar(330,.06);e.cd=.12;break}}}
const cx=e.x+e.w/2,cy=e.y+e.h/2;
// la punta del hilo lo enreda
if(trazo&&Math.hypot(trazo.tx-cx,trazo.ty-cy)<20||e.t=='r'&&lines.some(l=>!l.f&&l.p.some(([u,v])=>Math.hypot(u-cx,v-cy)<14))){e.muerto=1;chispas(cx,cy,16,'#d5d0e0',160);mar(1175,.1);mar(1568,.07);shake=3}
else if(j.x+3<e.x+e.w&&j.x+j.w-3>e.x&&j.y+3<e.y+e.h&&j.y+j.h-2>e.y)return morir(0)}
enem=enem.filter(e=>!e.muerto)}
function dibEnem(){for(const e of enem){x.save();x.lineWidth=2;x.strokeStyle='#16213a';
if(e.t=='r'){x.translate(e.x+e.w/2,e.y+e.h);x.scale(e.vx>0?1:-1,1);
x.beginPath();x.moveTo(-10,-4);x.quadraticCurveTo(-20,-2+Math.sin(t*10)*3,-24,-8);x.strokeStyle='#f28bb0';x.stroke();x.strokeStyle='#16213a';
x.fillStyle='#8d8fa6';x.beginPath();x.ellipse(0,-6,11,6,0,0,7);x.fill();x.stroke();
x.fillStyle='#f7a1b5';x.beginPath();x.arc(4,-11,4,0,7);x.fill();x.stroke();
x.fillStyle='#16213a';x.beginPath();x.arc(8,-7,1.3,0,7);x.fill();x.fillStyle='#f28bb0';x.beginPath();x.arc(11,-5,1.4,0,7);x.fill()}
else{const a=Math.abs(Math.sin(t*18+e.ph))*.8+.2;x.translate(e.x+e.w/2,e.y+e.h/2);x.scale(1.6,1.6);x.lineWidth=1.4;x.strokeStyle='#2e2219';
[-1,1].forEach(q=>{x.fillStyle='#e3d3b2';x.beginPath();x.ellipse(q*7,-2,8,6*a,q*.5,0,7);x.fill();x.stroke();x.fillStyle='#8a7560';x.beginPath();x.arc(q*8,-2,1.8*a,0,7);x.fill()});
x.fillStyle='#5b4a3a';x.beginPath();x.ellipse(0,0,3,7,0,0,7);x.fill();x.beginPath();x.moveTo(-1,-6);x.lineTo(-4,-12);x.moveTo(1,-6);x.lineTo(4,-12);x.stroke()}
x.restore()}}

// ---------- hilo de estambre ----------
function finTrazo(b){if(trazo.p.length<2)lines.splice(lines.indexOf(trazo),1);trazo=null;bloq=b}
function hiloPaso(dt){const dib=tecla('ShiftLeft','ShiftRight','KeyJ');if(!dib)bloq=0;
if(dib&&!trazo&&!bloq&&tinta>1){const sx=j.x+j.w/2+j.dir*17,sy=j.y+j.h-12;
// el hilo hereda parte del movimiento del gato
trazo={p:[[sx,sy]],tx:sx,ty:sy,vx:7*j.dir+j.vx/120,vy:-3+Math.min(0,j.vy)/120,a:1,v:4,off:0,s:Math.random()*99};lines.push(trazo);
const act=lines.filter(l=>!l.f);if(act.length>2)act[0].f=1}
if(trazo){if(!dib)return finTrazo(0);
// en el aire el chorro empuja al gato hacia arriba/atrás
if(!j.suelo){j.vy-=1100*dt;j.vx-=trazo.vx*12*dt}
// punta como proyectil; ↑ estira el arco, ↓ lo hace caer antes
